[package]
name = "genesis-core"
version = "0.7.0"
description = "Embedded, domain-neutral information engine with durable identity and canonical records"
authors = ["Genesis Core contributors"]
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/josephrghall/genesis-core"
documentation = "https://docs.rs/genesis-core"
keywords = ["embedded", "graph", "metadata", "sqlite", "local-first"]
categories = ["database-implementations", "data-structures"]
edition = "2021"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
uuid = { version = "1.26", features = ["serde", "v7"] }
